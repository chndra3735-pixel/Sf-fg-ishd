name: Build SwarRoom Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build SwarRoom APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses & Prepare SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" 2>&1 | tail -n 15 || true
          set -o pipefail
          ls -la "$SDK_ROOT/licenses" "$SDK_ROOT/platforms" || true

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Debug Keystore for Google Sign-In SHA-1
        env:
          SECRET_DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SECRET_DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$SECRET_DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret"
            echo "KEYSTORE_MATCHED=true" >> "$GITHUB_ENV"
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64"
            echo "KEYSTORE_MATCHED=true" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA \
              -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::debug.keystore.base64 and DEBUG_KEYSTORE_BASE64 secret missing; generated random keystore (Google Sign-In needs DEBUG_KEYSTORE_BASE64 secret or this SHA-1 added in Firebase Console)."
            echo "KEYSTORE_MATCHED=false" >> "$GITHUB_ENV"
          fi
          SHA1_VAL=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:" | head -n 1 | sed 's/.*SHA1:[[:space:]]*//')
          echo "APK_SHA1=$SHA1_VAL" >> "$GITHUB_ENV"
          echo "Active APK SHA1: $SHA1_VAL"

      - name: Configure .env Secrets (Supabase & App Config)
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SECRET_SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          SECRET_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SECRET_GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          cp .env.example .env
          clean_val() {
            printf '%s' "$1" | tr -d '\r\n"' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }
          SUPA_URL=""
          SUPA_KEY=""
          SUPA_BUCKET=""
          if [ -n "$SECRET_SUPABASE_URL" ]; then
            SUPA_URL=$(clean_val "$SECRET_SUPABASE_URL" | sed 's/^SUPABASE_URL=//')
            grep -v '^SUPABASE_URL=' .env > .env.tmp && mv .env.tmp .env
            printf 'SUPABASE_URL=%s\n' "$SUPA_URL" >> .env
            echo "SUPABASE_URL=$SUPA_URL" >> "$GITHUB_ENV"
          fi
          if [ -n "$SECRET_SUPABASE_ANON_KEY" ]; then
            SUPA_KEY=$(clean_val "$SECRET_SUPABASE_ANON_KEY" | sed 's/^SUPABASE_ANON_KEY=//; s/^Sb_publishable_/sb_publishable_/')
            grep -v '^SUPABASE_ANON_KEY=' .env > .env.tmp && mv .env.tmp .env
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPA_KEY" >> .env
            echo "SUPABASE_ANON_KEY=$SUPA_KEY" >> "$GITHUB_ENV"
          fi
          if [ -n "$SECRET_SUPABASE_BUCKET" ]; then
            SUPA_BUCKET=$(clean_val "$SECRET_SUPABASE_BUCKET" | sed 's/^SUPABASE_BUCKET=//')
            grep -v '^SUPABASE_BUCKET=' .env > .env.tmp && mv .env.tmp .env
            printf 'SUPABASE_BUCKET=%s\n' "$SUPA_BUCKET" >> .env
            echo "SUPABASE_BUCKET=$SUPA_BUCKET" >> "$GITHUB_ENV"
          fi
          if [ -n "$SECRET_GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$SECRET_GOOGLE_SERVICES_JSON" | sed '1s/^\xEF\xBB\xBF//' | tr -d '\r' > app/google-services.json
            echo "Applied GOOGLE_SERVICES_JSON secret"
          elif [ -n "$SECRET_GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$SECRET_GOOGLE_SERVICES_JSON_B64" | tr -d '\r\n ' | base64 -d > app/google-services.json
            echo "Applied GOOGLE_SERVICES_JSON_BASE64 secret"
          fi
          if [ -f app/google-services.json ]; then
            if python3 -c "import json; d=json.load(open('app/google-services.json')); assert 'client' in d and len(d['client'])>0"; then
              echo "google-services.json verified (valid JSON)"
              echo "FIREBASE_CONFIGURED=true" >> "$GITHUB_ENV"
            else
              echo "WARNING: app/google-services.json is invalid JSON; removing broken file so build won't fail silently"
              rm -f app/google-services.json
              echo "FIREBASE_CONFIGURED=false" >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::app/google-services.json missing! Add GOOGLE_SERVICES_JSON secret in GitHub Actions Secrets so Firebase & Google Sign-In work in the APK."
            echo "FIREBASE_CONFIGURED=false" >> "$GITHUB_ENV"
          fi
          if [ -n "$SUPA_URL" ] && [ -n "$SUPA_KEY" ]; then
            echo "Supabase secrets verified"
            echo "SUPABASE_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY missing in GitHub Secrets! Media upload (DP/video/gifts) will be disabled in APK."
            echo "SUPABASE_CONFIGURED=false" >> "$GITHUB_ENV"
          fi
          test -f app/src/main/res/values/firebase_applet_config.xml && echo "firebase_applet_config.xml verified"

      - name: Build SwarRoom APK
        run: |
          set +e
          gradle :app:assembleDebug \
            --no-daemon \
            --no-build-cache \
            --console=plain \
            --max-workers=2 \
            -Dorg.gradle.workers.max=2 \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.configuration-cache=false \
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee gradle-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "=== KOTLIN / BUILD ERROR DETAILS ==="
            grep -E "^e: |error:|Exception" gradle-build.log | head -n 30 || true
            echo "=== FULL CONTEXT BEFORE FAILURE ==="
            grep -B 40 -A 15 "FAILURE: Build failed" gradle-build.log || tail -n 60 gradle-build.log
            {
              echo "### SwarRoom APK Build Failed"
              echo '```'
              grep -E "^e: |error:|What went wrong:" -A 4 gradle-build.log | head -n 45 || tail -n 50 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$BUILD_EXIT"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SwarRoom.apk
          ls -lh app/build/outputs/apk/debug/SwarRoom.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwarRoom-APK
          path: app/build/outputs/apk/debug/SwarRoom.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SwarRoom APK v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/SwarRoom.apk
          generate_release_notes: false

      - name: Write Build Summary
        run: |
          {
            echo "### SwarRoom APK Build Complete"
            echo "- **Direct APK Download**: Check the **Releases** tab on GitHub for \`SwarRoom.apk\`, or download \`SwarRoom-APK\` from **Artifacts** below."
            if [ "${FIREBASE_CONFIGURED:-false}" = "true" ]; then
              echo "- **Firebase Config**: Included via \`GOOGLE_SERVICES_JSON\`."
            else
              echo "- **WARNING - Firebase Not Configured**: \`GOOGLE_SERVICES_JSON\` secret was not set in GitHub Actions Secrets. Add it so Firebase & Google Sign-In work in the APK."
            fi
            if [ "${KEYSTORE_MATCHED:-false}" = "true" ]; then
              echo "- **Signing Keystore (SHA-1)**: Restored matching keystore (\`${APK_SHA1:-unknown}\`)."
            else
              echo "- **WARNING - Random Keystore Used**: Generated temporary SHA-1 \`${APK_SHA1:-unknown}\`. Add \`DEBUG_KEYSTORE_BASE64\` secret in GitHub Actions (from \`debug.keystore.base64\`) so Google Sign-In matches Firebase Console."
            fi
            if [ "${SUPABASE_CONFIGURED:-false}" = "true" ]; then
              echo "- **Supabase Storage**: Configured via GitHub Secrets."
            else
              echo "- **Supabase Storage**: Add \`SUPABASE_URL\`, \`SUPABASE_ANON_KEY\`, and \`SUPABASE_BUCKET\` secrets in GitHub for media uploads."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
